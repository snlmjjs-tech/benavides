<div class="app">

    <div class="brand"><img src="assets/logo.png" alt="Familia Benavides" width="92" height="92">

        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="gSearch" type="search" placeholder="Buscar propiedad, arrendatario, recibo, gasto…" autocomplete="off" aria-label="Búsqueda global"><kbd>/</kbd>
        <div class="gres" id="gRes" hidden></div>
      </div>
      <div class="userbox" id="userBox"></div>
    </header>
    <main id="main"><div class="sk-row"><div class="sk sk-card"></div><div class="sk sk-card"></div><div class="sk sk-card"></div><div class="sk sk-card"></div></div><div class="sk sk-panel"></div></main>

<div id="toastRoot"></div>
